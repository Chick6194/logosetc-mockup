<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Request a song — SongGift</title><link rel=stylesheet href=style.css></head><body>
<nav><a class=logo href="index.html" style="text-decoration:none">Song<span>Gift</span></a><span><a href="track.html?demo=1">Track order</a> &nbsp; <a class=btn href="request.html">Start a song</a></span></nav>
<section><div class=wrap style="max-width:640px"><h2>Request your song</h2>
<form id=f class=card>
<label>Recipient's name</label><input name=recipient required>
<label>Occasion</label><select name=occasion><option>Birthday<option>Wedding<option>Anniversary<option>Other</select>
<label>Story and details</label><textarea name=story rows=5 required placeholder="Names, memories, inside jokes..."></textarea>
<label>How to pronounce the recipient's name</label><input name=pron placeholder="e.g. MAR-ee-ah">
<label>Must-include words, phrases, or nicknames</label><textarea name=must rows=2></textarea>
<label>Genre</label><select name=genre><option>Pop<option>Acoustic<option>Country<option>R&amp;B<option>Rock<option>Gospel</select>
<label>Mood</label><select name=mood><option>Joyful<option>Romantic<option>Heartfelt<option>Funny<option>Nostalgic</select>
<label>Tempo</label><select name=tempo><option>Slow<option selected>Medium<option>Upbeat</select>
<label>Song you'd like it to sound like (optional)</label><input name=like placeholder="Song title and artist">
<label>Anything to avoid</label><textarea name=avoid rows=2 placeholder="Topics, words, or styles to leave out"></textarea>
<label>Deadline</label><input type=date name=deadline required>
<label>Package</label><select name=tier><option value=basic>Basic — $99<option value=standard selected>Standard — $149<option value=premium>Premium — $249</select>
<label><input type=checkbox name=lv style="width:auto"> Lyric video (price TBD)</label>
<h3 style="margin-top:24px">Choose your artist</h3><label>Voice</label><select id=vf onchange="document.querySelectorAll('.art').forEach(x=>x.style.display=(vf.value=='any'||x.dataset.v==vf.value)?'block':'none')"><option value=any>No preference<option value=Male>Male<option value=Female>Female</select><label class=card style="display:block;margin:8px 0;font-weight:normal"><input type=radio name=artist value="Any available artist" style="width:auto" checked> <b>Any available artist</b> <span class=ph>— we match you with the best fit</span></label><label class="card art" data-v=Female style="display:block;margin:8px 0;font-weight:normal"><input type=radio name=artist value="Sample Artist A — R&B/Soul" style="width:auto"> <b>Sample Artist A — R&B/Soul</b> <span class=steps style="display:inline"><span>Female voice</span></span> <span class=ph>(sample placeholder, not a real artist)</span><br><button type=button onclick="new Audio('voice-a.wav').play()" style="margin:6px 0">▶ Hear voice sample</button> <span class=ph>placeholder tone, not a real voice</span><br><a href="https://talenthubonline.com" target=_blank>View TalentHub profile</a></label><label class="card art" data-v=Male style="display:block;margin:8px 0;font-weight:normal"><input type=radio name=artist value="Sample Artist B — Pop/Acoustic" style="width:auto"> <b>Sample Artist B — Pop/Acoustic</b> <span class=steps style="display:inline"><span>Male voice</span></span> <span class=ph>(sample placeholder, not a real artist)</span><br><button type=button onclick="new Audio('voice-b.wav').play()" style="margin:6px 0">▶ Hear voice sample</button> <span class=ph>placeholder tone, not a real voice</span><br><a href="https://talenthubonline.com" target=_blank>View TalentHub profile</a></label><label class="card art" data-v=Male style="display:block;margin:8px 0;font-weight:normal"><input type=radio name=artist value="Sample Artist C — Country/Folk" style="width:auto"> <b>Sample Artist C — Country/Folk</b> <span class=steps style="display:inline"><span>Male voice</span></span> <span class=ph>(sample placeholder, not a real artist)</span><br><button type=button onclick="new Audio('voice-c.wav').play()" style="margin:6px 0">▶ Hear voice sample</button> <span class=ph>placeholder tone, not a real voice</span><br><a href="https://talenthubonline.com" target=_blank>View TalentHub profile</a></label><label class="card art" data-v=Female style="display:block;margin:8px 0;font-weight:normal"><input type=radio name=artist value="Sample Artist D — Gospel/Inspirational" style="width:auto"> <b>Sample Artist D — Gospel/Inspirational</b> <span class=steps style="display:inline"><span>Female voice</span></span> <span class=ph>(sample placeholder, not a real artist)</span><br><button type=button onclick="new Audio('voice-d.wav').play()" style="margin:6px 0">▶ Hear voice sample</button> <span class=ph>placeholder tone, not a real voice</span><br><a href="https://talenthubonline.com" target=_blank>View TalentHub profile</a></label>
<label>Your name</label><input name=name required><label>Email</label><input type=email name=email required>
<label><input type=checkbox required style="width:auto"> I confirm I have the right to share the names and stories above, and agree to the <a href="terms.html">terms</a>.</label>
<br><button class=btn>Continue to payment</button></form>
<div id=pay class=card style="display:none"><h3>Checkout</h3><div class=demo><b>DEMO ONLY</b> — no real payment is taken and no card is charged.</div><p id=sum></p>
<label>Rush delivery (standard is 7 days)</label><select id=rs><option value=0>No rush — 7 days<option value=1>6 days +$25<option value=2>5 days +$50<option value=3>4 days +$75<option value=4>3 days +$100<option value=5>2 days +$125<option value=6>Next day +$150</select>
<label>Card number</label><input value="4242 4242 4242 4242 (demo)" disabled><br><br><button class=btn id=pb>Pay (demo)</button></div>
<div id=done class=card style="display:none"><h3>Thank you!</h3><p>Your order <b id=oid></b> is received.</p><a class=btn id=tl>Track your order</a></div>
</div></section>
<footer><a href="terms.html">Terms (draft)</a> · Demo site<br>Powered by <a href="https://talenthubonline.com">TalentHub Online</a></footer><script src="app.js"></script>
<script>let o;f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.rush=0;d.id='SG-'+(1000+load().length+1+Math.floor(Math.random()*900));d.status=0;o=d;upd();f.style.display='none';pay.style.display='block'};
function upd(){o.rush=+rs.value;o.total=TIERS[o.tier][1]+o.rush*25;sum.textContent=TIERS[o.tier][0]+rushTxt(o.rush)+' with '+o.artist+' — total $'+o.total+(o.lv?' (+ lyric video, TBD)':'')}rs.onchange=upd;
pb.onclick=()=>{const a=load();a.push(o);save(a);pay.style.display='none';done.style.display='block';oid.textContent=o.id;tl.href='track.html?id='+o.id}</script></body></html>
