<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Staff queue — SongGift</title><link rel=stylesheet href=style.css></head><body>
<nav><span class=logo>Song<span>Gift</span> · Staff</span></nav>
<section><div class=wrap><h2>Order queue</h2><div class=demo>Demo admin — no login. Data lives only in this browser.</div><div id=q></div></div></section>
<footer>Powered by <a href="https://talenthubonline.com">TalentHub Online</a></footer><script src="app.js"></script>
<script>function r(){const a=load();q.innerHTML=ST.map((s,si)=>'<h3>'+s+'</h3><div class=card style="overflow-x:auto"><table><tr><th>Order<th>For<th>Occasion<th>Package<th>Deadline<th>Actions</tr>'+(a.map((o,i)=>[o,i]).filter(([o])=>o.status==si).map(([o,i])=>'<tr><td>'+o.id+'<td>'+o.recipient+'<td>'+o.occasion+'<td>'+TIERS[o.tier][0]+(o.rush?' <b>RUSH '+(7-o.rush)+'d</b>':'')+'<br><span class=ph>'+(o.artist||'')+'</span>'+'<td>'+(o.deadline||'')+'<td>'+(si<4?'<button onclick="adv('+i+')">Advance →</button> ':'')+(si==3||si==4?'<label style="display:inline;font-weight:normal">Upload song <input type=file accept="audio/*" onchange="up('+i+',this)" style="width:auto"></label>':'')+(o.song?' ✔ song':'')).join('')||'<tr><td colspan=6>None')+'</table></div>').join('')}
function adv(i){const a=load();if(a[i].status==3&&!a[i].song){alert('Upload the finished song first.');return}a[i].status++;save(a);r()}
function up(i,el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const a=load();a[i].song=f.size<3e6?rd.result:'sample.wav';try{save(a)}catch(e){a[i].song='sample.wav';save(a)}r()};rd.readAsDataURL(f)}
r()</script></body></html>
