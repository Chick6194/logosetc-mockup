<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artwork Portal (Demo) | Logos Etc</title>
<style>
:root{--navy:#13294B;--dark:#0B1F3A;--gold:#C9A227;--bg:#f5f6f8;--ink:#1b2430;--mut:#5d6b7e}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:"Futura","Avenir Next Condensed","Trebuchet MS",sans-serif;margin:0 0 .4em;color:var(--navy)}
.demo{background:var(--gold);color:var(--dark);text-align:center;font-weight:700;padding:8px;font-size:.9rem}
header{background:var(--navy);color:#fff}.nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:20px;height:64px;padding:0 20px}
.logo{color:#fff;font-weight:900;font-size:1.4rem;text-decoration:none}.logo span{color:var(--gold)}
.nav nav{flex:1;display:flex;gap:18px}.nav a.l{color:#dfe5ee;text-decoration:none;font-weight:600;cursor:pointer}.nav a.l:hover{color:var(--gold)}
main{max-width:1100px;margin:28px auto;padding:0 20px}
.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:20px}
.btn{display:inline-block;background:var(--gold);color:var(--dark);border:0;border-radius:8px;padding:11px 20px;font-weight:700;cursor:pointer;font-size:.95rem;text-decoration:none}
.btn.n{background:var(--navy);color:#fff}.btn.o{background:#fff;color:var(--navy);border:2px solid var(--navy)}.btn.s{padding:7px 12px;font-size:.85rem}
label{display:block;font-weight:600;margin:14px 0 6px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd3dd;border-radius:8px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.opt{border:2px solid #dde3ea;border-radius:12px;padding:18px;cursor:pointer;background:#fff}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.25)}.opt b.p{font-size:1.6rem;color:var(--navy);display:block;margin:6px 0}
.note{background:#fff8e1;border-left:4px solid var(--gold);padding:12px 14px;border-radius:6px;margin:14px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eef1f4;font-size:.93rem}th{color:var(--mut);font-weight:600}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700}
.t-rev{background:#e8eef7;color:var(--navy)}.t-q{background:#fff1c7;color:#7a5c00}.t-nc{background:#dff3e4;color:#1d6b35}.t-pd{background:#e6e0f7;color:#4b2e9a}.t-dn{background:var(--navy);color:#fff}
.ex{font-size:.75rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.drop{border:2px dashed #b8c3d1;border-radius:12px;padding:30px;text-align:center;color:var(--mut);cursor:pointer;background:#fafbfc}
.steps{display:flex;gap:8px;margin:16px 0}.steps div{flex:1;padding:10px;border-radius:8px;background:#eef1f4;text-align:center;font-size:.85rem;font-weight:600;color:var(--mut)}.steps .on{background:var(--navy);color:#fff}
.stripe{background:#635bff;color:#fff}.sum td{border:0;padding:6px 0}.hide{display:none}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid,.two{grid-template-columns:1fr}.nav nav{display:none}}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:30px}
</style></head><body>
<div class="demo">DEMO MOCKUP — not a real site. No real accounts, uploads, or payments. All data is example data.</div>
<header><div class="nav"><a class="logo" href="#" onclick="go('dash')">Logos <span>Etc</span> <small style="font-size:.6em;font-weight:600;color:#cfd8e3">Artwork</small></a>
<nav id="mainnav" class="hide"><a class="l" onclick="go('dash')">Dashboard</a><a class="l" onclick="go('upload')">New artwork</a><a class="l" onclick="go('files')">Finished files</a><a class="l" onclick="go('account')">My account</a><a class="l" onclick="go('admin')">Admin (demo)</a></nav>
<a class="l hide" id="signout" style="color:#fff;cursor:pointer" onclick="signOut()">Sign out</a></div></header>
<main id="app"></main>
<footer>Logos Etc · 192 S Hillview Dr, Milpitas, CA · Mockup for review only</footer>
<script>
const PRICES={vector:15,emb:35,bundle:50};
const NAMES={vector:'Vector artwork (AI/EPS/SVG/PDF)',emb:'Embroidery digitizing (EMB)',bundle:'Bundle: vector + EMB, free cap logo'};
const CL={'Example: Maria Lopez':{company:'Sample Bakery Co.',email:'maria@example.com',phone:'(555) 010-1001',ship:'100 Example St, Sampletown, CA 95000',bill:'Same as shipping'},
'Example: Jordan Lee':{company:'Sample Softball League',email:'jordan@example.com',phone:'(555) 010-1002',ship:'200 Demo Ave, Sampletown, CA 95000',bill:'PO Box 12, Sampletown, CA 95000'},
'Example: Priya Patel':{company:'Sample Realty Group',email:'priya@example.com',phone:'(555) 010-1003',ship:'300 Mock Blvd, Sampletown, CA 95000',bill:'Same as shipping'},
'Example: Sam Carter':{company:'Sample Fitness Studio',email:'sam@example.com',phone:'(555) 010-1004',ship:'400 Test Rd, Sampletown, CA 95000',bill:'Same as shipping'}};
let S={user:null,sel:'vector',subs:[
 {id:'A-1042',client:'Example: Maria Lopez',company:'Sample Bakery Co.',file:'example-bakery-logo.png',type:'emb',size:'3.5" wide',place:'Left chest',notes:'Example: match navy thread',status:'quote',price:35,date:'Oct 26'},
 {id:'A-1039',client:'Example: Jordan Lee',company:'Sample Softball League',file:'example-softball-team.jpg',type:'vector',size:'10" wide',place:'Full back',notes:'Example',status:'review',price:null,date:'Oct 27'},
 {id:'A-1031',client:'Example: Priya Patel',company:'Sample Realty Group',file:'example-realty-mark.ai',type:'vector',size:'4" wide',place:'Left chest',notes:'Example: already clean vector',status:'nocharge',price:0,date:'Oct 20'},
 {id:'A-1025',client:'Example: Sam Carter',company:'Sample Fitness Studio',file:'example-gym-logo.png',type:'bundle',size:'3" + cap',place:'Chest + cap front',notes:'Example',status:'done',price:50,date:'Oct 15'}]};
const TAG={review:['Under review','t-rev'],quote:['Quote ready','t-q'],nocharge:['No charge — approved','t-nc'],paid:['Paid — in progress','t-pd'],done:['Finished','t-dn']};
const $=h=>document.getElementById('app').innerHTML=h;
const tag=s=>`<span class="tag ${TAG[s][1]}">${TAG[s][0]}</span>`;
const money=s=>s.price===null?'—':s.price===0?'$0 (no charge)':'$'+s.price;
function go(v,a){if(!S.user&&!['signin','admin','client'].includes(v)){v='signin'}document.getElementById('mainnav').classList.toggle('hide',!S.user);document.getElementById('signout').classList.toggle('hide',!S.user);location.hash=v+(a?'/'+a:'');window.scrollTo(0,0);V[v](a)}
function mkUser(c){const g=i=>(document.getElementById(i)||{}).value;S.user=g('nm')||'Example: Sample Customer';if(!CL[S.user])CL[S.user]={company:c?g('co'):'Example Company LLC',email:g('em'),phone:c?g('ph'):'(555) 010-0000',ship:c?g('sh'):'123 Example St, Sampletown, CA 95000',bill:c?g('bi'):'Same as shipping'};go('dash')}
function saveAcct(){const c=CL[S.user];['company','email','phone','ship','bill'].forEach(k=>c[k]=document.getElementById('a_'+k).value);const n=document.getElementById('a_name').value;if(n!==S.user){CL[n]=c;S.subs.forEach(x=>{if(x.client===S.user)x.client=n});S.user=n}S.subs.forEach(x=>{if(x.client===S.user)x.company=c.company});document.getElementById('sv').textContent='Saved (demo only)'}
function signOut(){S.user=null;go('signin')}
const V={
signin(a){const F=(id,l,v)=>`<label>${l}</label><input id="${id}" value="${v}">`;$(`<div class="card" style="max-width:520px;margin:30px auto"><h1>Sign in or create account</h1><p style="color:var(--mut)">Your uploads, quotes and finished files in one place.</p>
<div class="note"><b>Demo only.</b> Don't type real information or a real password — example values are filled in and nothing is saved.</div>
${F('nm','Name','Example: Sample Customer')}${F('em','Email','sample@example.com')}<label>Password</label><input type="password" value="demo">
<div class="row" style="margin-top:18px"><button class="btn n" onclick="mkUser(0)">Sign in</button><a href="#" onclick="document.getElementById('ca').classList.toggle('hide');return false">New here? Create an account ▾</a></div>
<div id="ca" class="${a?'':'hide'}"><hr style="margin:20px 0;border:0;border-top:1px solid #eee"><h3>Create account</h3>${F('co','Company','Example Company LLC')}${F('ph','Phone','(555) 010-0000')}${F('sh','Shipping address','123 Example St, Sampletown, CA 95000')}${F('bi','Billing address','Same as shipping')}
<button class="btn" style="margin-top:16px" onclick="mkUser(1)">Create account</button></div></div>`)},
account(){const c=CL[S.user];$(`<div class="card" style="max-width:640px"><h1>My account</h1><p class="ex">Demo — changes are not saved anywhere</p>
${[['name','Name',S.user],['company','Company',c.company],['email','Email',c.email],['phone','Phone',c.phone],['ship','Shipping address',c.ship],['bill','Billing address',c.bill]].map(([k,l,v])=>`<label>${l}</label><input id="a_${k}" value="${v}">`).join('')}
<div class="row" style="margin-top:16px"><button class="btn n" onclick="saveAcct()">Save changes</button><span id="sv" class="ex"></span></div></div>`)},
client(n){n=decodeURIComponent(n);const c=CL[n]||{};const L=S.subs.filter(x=>x.client===n);$(`<div class="card"><p><a href="#" onclick="go('admin');return false">← All submissions</a></p><h1>${n}</h1><p style="font-size:1.1rem;margin-top:-6px">${c.company||''}</p><p class="ex">Demo admin view · example data</p>
<div class="two"><table class="sum"><tr><td>Email</td><td>${c.email||'—'}</td></tr><tr><td>Phone</td><td>${c.phone||'—'}</td></tr></table><table class="sum"><tr><td>Shipping</td><td>${c.ship||'—'}</td></tr><tr><td>Billing</td><td>${c.bill||'—'}</td></tr></table></div>
<h3 style="margin-top:20px">Submission history (${L.length})</h3><table><tr><th>ID</th><th>File</th><th>Type</th><th>Submitted</th><th>Status</th><th>Price</th></tr>${L.map(x=>`<tr><td>${x.id}</td><td>${x.file}</td><td>${NAMES[x.type]}</td><td>${x.date}</td><td>${tag(x.status)}</td><td>${money(x)}</td></tr>`).join('')}</table></div>`)},
dash(){const q=S.subs.filter(s=>s.status==='quote'),d=S.subs.filter(s=>s.status==='done'||s.status==='nocharge');
$(`<div class="row" style="justify-content:space-between"><h1>Welcome, ${S.user}</h1><button class="btn" onclick="go('upload')">+ Upload new artwork</button></div><p class="ex">Example data</p>
<div class="two"><div class="card"><h3>Quotes awaiting payment (${q.length})</h3>${q.map(s=>`<p>${s.id} · ${NAMES[s.type]}<br><b>$${s.price}</b> <button class="btn s" onclick="go('pay','${s.id}')">Review & pay</button></p>`).join('')||'<p>None</p>'}</div>
<div class="card"><h3>Finished files (${d.length})</h3>${d.map(s=>`<p>${s.id} · ${s.file} <button class="btn o s" onclick="go('files')">Download</button></p>`).join('')}</div></div>
<div class="card"><h3>My uploads</h3><table><tr><th>ID</th><th>File</th><th>Type</th><th>Submitted</th><th>Status</th><th>Price</th><th></th></tr>
${S.subs.map(s=>`<tr><td>${s.id}</td><td>${s.file}</td><td>${NAMES[s.type]}</td><td>${s.date}</td><td>${tag(s.status)}</td><td>${money(s)}</td><td><a href="#" onclick="go('status','${s.id}');return false">View</a></td></tr>`).join('')}</table></div>`)},
upload(){$(`<div class="card"><h1>Upload new artwork</h1><p>Choose what you need. We review every file first — <b>if your artwork is already clean enough to use, there's no charge.</b></p>
<div class="grid">${['vector','emb','bundle'].map(k=>`<div class="opt ${S.sel===k?'sel':''}" onclick="S.sel='${k}';V.upload()"><span class="ex">${k==='bundle'?'Best value':'Single file'}</span><b class="p">$${PRICES[k]}</b><b>${NAMES[k]}</b><p style="color:var(--mut);font-size:.9rem">${k==='vector'?'Clean, scalable art for screen print, DTF, signs.':k==='emb'?'Stitch file ready for embroidery machines.':'Vector + EMB, plus a <b>free cap logo version</b>.'}</p></div>`).join('')}</div>
<label>Artwork file</label><div class="drop" onclick="this.innerHTML='📎 example-new-logo.png attached (demo — nothing uploaded)'">Click to attach a file (demo — nothing is uploaded)<br><small>PNG, JPG, PDF, AI, EPS, SVG</small></div>
<div class="two"><div><label>Size</label><input id="sz" placeholder='e.g. 3.5" wide'></div><div><label>Placement</label><select id="pl"><option>Left chest</option><option>Full front</option><option>Full back</option><option>Cap front</option><option>Sleeve</option><option>Other</option></select></div></div>
<label>Notes</label><textarea id="nt" rows="3" placeholder="Colors, thread, anything we should know"></textarea>
<div class="note">Up to <b>$${PRICES[S.sel]}</b> for ${NAMES[S.sel]}. You won't be charged now — we'll review and either approve it at no charge or send a quote.</div>
<button class="btn n" onclick="submitArt()">Submit for review</button></div>`)},
status(id){const s=S.subs.find(x=>x.id===id);const st=['review','quote/nocharge','paid','done'];const i={review:0,quote:1,nocharge:1,paid:2,done:3}[s.status];
$(`<div class="card"><p><a href="#" onclick="go('dash');return false">← Dashboard</a></p><h1>${s.id} ${tag(s.status)}</h1><p class="ex">Example data</p>
<div class="steps"><div class="${i>=0?'on':''}">1. Under review</div><div class="${i>=1?'on':''}">2. ${s.status==='nocharge'?'No charge — approved':'Quote ready'}</div><div class="${i>=2?'on':''}">3. ${s.status==='nocharge'?'Approved':'Paid / in progress'}</div><div class="${i>=3||s.status==='nocharge'?'on':''}">4. Files ready</div></div>
<table class="sum"><tr><td>Client</td><td><b>${s.client}</b> · ${s.company}</td></tr><tr><td>File</td><td>${s.file}</td></tr><tr><td>Type</td><td>${NAMES[s.type]}</td></tr><tr><td>Size / placement</td><td>${s.size} · ${s.place}</td></tr><tr><td>Notes</td><td>${s.notes}</td></tr><tr><td>Price</td><td><b>${money(s)}</b></td></tr></table>
${s.status==='review'?'<div class="note">We\'re checking your artwork. If it\'s clean enough to use, it\'s approved at no charge; otherwise you\'ll get a quote by email.</div><p class="ex">Demo: switch to the Admin view to approve or quote this.</p>':''}
${s.status==='quote'?`<button class="btn" onclick="go('pay','${s.id}')">Review quote & pay $${s.price}</button>`:''}
${s.status==='nocharge'||s.status==='done'?`<button class="btn n" onclick="go('files')">Go to finished files</button>`:''}</div>`)},
pay(id){const s=S.subs.find(x=>x.id===id);
$(`<div class="card" style="max-width:560px;margin:auto"><p><a href="#" onclick="go('dash');return false">← Dashboard</a></p><h1>Your quote</h1><p class="ex">Example data</p>
<table><tr><td>${NAMES[s.type]}<br><small>${s.file} · ${s.size} · ${s.place}</small></td><td style="text-align:right"><b>$${s.price}.00</b></td></tr>${s.type==='bundle'?'<tr><td>Cap logo version</td><td style="text-align:right">FREE</td></tr>':''}<tr><th>Total</th><th style="text-align:right">$${s.price}.00</th></tr></table>
<div class="note">Work starts after payment. Finished files will appear in your account to download.</div>
<button class="btn stripe" style="width:100%" onclick="s=S.subs.find(x=>x.id==='${id}');s.status='paid';alert('DEMO: no payment was made. In the real site this opens Stripe Checkout.');go('status','${id}')">Pay with Stripe (demo)</button></div>`)},
files(){const d=S.subs.filter(s=>s.status==='done'||s.status==='nocharge');
$(`<div class="card"><h1>Finished files</h1><p class="ex">Example data — download buttons are demo only</p><table><tr><th>ID</th><th>Original</th><th>Type</th><th>Files</th></tr>
${d.map(s=>`<tr><td>${s.id}</td><td>${s.file}</td><td>${NAMES[s.type]}</td><td>${(s.type==='vector'?['.ai','.eps','.svg','.pdf']:s.type==='emb'?['.emb','.dst']:['.ai','.pdf','.emb','.dst','cap .emb']).map(x=>`<button class="btn o s" onclick="alert('Demo: no file')">⬇ ${x}</button>`).join(' ')}</td></tr>`).join('')}</table></div>`)},
admin(){$(`<div class="card"><h1>Admin — submissions</h1><p class="ex">Demo admin view · example data</p><table><tr><th>ID</th><th>Client</th><th>Customer file</th><th>Type</th><th>Status</th><th>Quote price</th><th>Actions</th></tr>
${S.subs.map(s=>`<tr><td>${s.id}</td><td><a href="#" onclick="go('client',encodeURIComponent('${s.client}'));return false" style="color:var(--navy);font-size:1rem;font-weight:700">${s.client}</a><br><small>${s.company}</small></td><td>${s.file}<br><small>${s.size} · ${s.place}</small></td><td>${NAMES[s.type]}</td><td>${tag(s.status)}</td><td>${s.status==='review'?`<input id="p${s.id}" style="width:80px" value="${PRICES[s.type]}">`:money(s)}</td><td>${s.status==='review'?`<button class="btn s" style="background:#dff3e4;color:#1d6b35" onclick="adm('${s.id}',0)">Mark no charge</button> <button class="btn n s" onclick="adm('${s.id}',1)">Send quote</button>`:''}</td></tr>`).join('')}</table></div>`)}};
function submitArt(){const n=1043+S.subs.length;S.subs.unshift({id:'A-'+n,client:S.user,company:CL[S.user].company,file:'example-new-logo.png',type:S.sel,size:document.getElementById('sz').value||'—',place:document.getElementById('pl').value,notes:document.getElementById('nt').value||'—',status:'review',price:null,date:'Today'});go('status','A-'+n)}
function adm(id,q){const s=S.subs.find(x=>x.id===id);if(q){s.status='quote';s.price=+document.getElementById('p'+id).value}else{s.status='nocharge';s.price=0}V.admin()}
const [h,a]=location.hash.slice(1).split('/');if(h&&!['signin','admin','client'].includes(h)){S.user='Example: Sample Customer';CL[S.user]={company:'Example Company LLC',email:'sample@example.com',phone:'(555) 010-0000',ship:'123 Example St, Sampletown, CA 95000',bill:'Same as shipping'}};go(h||'signin',a);
</script></body></html>
